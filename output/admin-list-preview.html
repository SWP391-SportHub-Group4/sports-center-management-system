<div id="sh-admin-demo">
  <div class="sh-demo-control"><label for="sh-state">Xem trạng thái của vùng dữ liệu</label><select id="sh-state"><option value="ready">Ready · Có dữ liệu</option><option value="loading">Loading · Đang tải</option><option value="empty">Empty · Không có kết quả</option><option value="error">Error · Lỗi tải dữ liệu</option><option value="forbidden">Forbidden · Không có quyền</option><option value="conflict">Conflict · Dữ liệu đã thay đổi</option></select></div>
  <section class="sh-surface" aria-label="Mẫu danh sách Admin">
    <header class="sh-header"><span class="sh-brand">SportHub / Admin</span><span class="sh-note">Dữ liệu minh họa</span></header>
    <div class="sh-content">
      <h2>Tài khoản nhân sự</h2>
      <div class="sh-filter" aria-label="FilterBar">
        <label>Tìm kiếm<input id="sh-search" placeholder="Nhập tên nhân sự…" type="search"></label>
        <label>Vai trò<select id="sh-role"><option value="">Tất cả vai trò</option><option>Quản lý</option><option>Lễ tân</option><option>Huấn luyện viên</option></select></label>
        <label>Trạng thái<select id="sh-status"><option value="">Tất cả trạng thái</option><option>Hoạt động</option><option>Đã khóa</option></select></label>
        <button type="button" id="sh-reset" class="cursor-interaction">Xóa lọc</button>
      </div>
      <div id="sh-body" aria-live="polite"></div>
    </div>
  </section>
</div>
<style>
#sh-admin-demo{--sh-bg:light-dark(#fff,#192122);--sh-ink:light-dark(#192122,#f6f9f9);--sh-muted:light-dark(#596668,#bbc7c8);--sh-line:light-dark(#d8e0e1,#414d4e);--sh-soft:light-dark(#f6f9f9,#2b3536);--sh-brand:light-dark(#02717a,#7fd4de);--sh-green-bg:light-dark(#eefdf1,#123523);--sh-green:light-dark(#005a2b,#9ee5b1);--sh-red-bg:light-dark(#fef6f6,#422023);--sh-red:light-dark(#a32129,#ffb6b6);color:var(--sh-ink);font-family:"Be Vietnam Pro",system-ui,sans-serif}
#sh-admin-demo *{box-sizing:border-box}
#sh-admin-demo .sh-demo-control{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;padding-right:90px}
#sh-admin-demo .sh-surface{background:var(--sh-bg);border:1px solid var(--sh-line);border-radius:12px;overflow:hidden}
#sh-admin-demo .sh-header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--sh-soft);padding:16px 20px;border-bottom:1px solid var(--sh-line)}
#sh-admin-demo .sh-brand{color:var(--sh-brand);font-weight:600}
#sh-admin-demo .sh-note{color:var(--sh-muted)}
#sh-admin-demo .sh-content{padding:20px}
#sh-admin-demo h2{margin:0 0 20px;font-size:22px;line-height:1.35}
#sh-admin-demo .sh-filter{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin-bottom:24px}
#sh-admin-demo label{display:flex;flex-direction:column;gap:6px;flex:1 1 140px;min-width:0}
#sh-admin-demo .sh-demo-control label{flex:0 1 auto}
#sh-admin-demo input,#sh-admin-demo select,#sh-admin-demo button{font:inherit;color:var(--sh-ink);background:var(--sh-bg);border:1px solid var(--sh-line);border-radius:6px;padding:9px 10px;max-width:100%}
#sh-admin-demo input::placeholder{color:var(--sh-muted)}
#sh-admin-demo button:hover{background:var(--sh-soft)}
#sh-admin-demo .sh-wrap{overflow-x:auto}
#sh-admin-demo table{width:100%;border-collapse:collapse;text-align:left}
#sh-admin-demo th,#sh-admin-demo td{padding:13px 10px;border-bottom:1px solid var(--sh-line);vertical-align:middle}
#sh-admin-demo thead{background:var(--sh-soft)}
#sh-admin-demo th{font-weight:600}
#sh-admin-demo .sh-chip{display:inline-block;padding:4px 9px;border-radius:999px;white-space:nowrap;background:var(--sh-green-bg);color:var(--sh-green)}
#sh-admin-demo .sh-chip.locked{background:var(--sh-red-bg);color:var(--sh-red)}
#sh-admin-demo .sh-footer{padding-top:16px;color:var(--sh-muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
#sh-admin-demo .sh-state{min-height:215px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:24px 12px}
#sh-admin-demo .sh-state h3,#sh-admin-demo .sh-state p{margin:0}
#sh-admin-demo .sh-state p{color:var(--sh-muted);max-width:52ch}
#sh-admin-demo .sh-primary{background:var(--sh-brand);color:var(--sh-bg);border-color:var(--sh-brand)}
#sh-admin-demo .sh-skeleton{height:15px;border-radius:4px;background:var(--sh-line);width:80%}
#sh-admin-demo .sh-caption{color:var(--sh-muted);margin:12px 0 0}
@media(max-width:480px){#sh-admin-demo .sh-content{padding:14px}#sh-admin-demo .sh-demo-control{padding-right:0}#sh-admin-demo .sh-demo-control select{width:100%}#sh-admin-demo th,#sh-admin-demo td{padding:10px 7px}#sh-admin-demo .sh-role-col{display:none}#sh-admin-demo button,#sh-admin-demo input,#sh-admin-demo select{min-height:44px}}
</style>
<script>
(()=>{
 const root=document.getElementById('sh-admin-demo');
 const find=id=>root.querySelector('#'+id);
 const state=find('sh-state'),search=find('sh-search'),role=find('sh-role'),status=find('sh-status'),body=find('sh-body');
 const rows=[{name:'Nguyễn Minh Anh',role:'Quản lý',status:'Hoạt động'},{name:'Trần Thanh Hà',role:'Lễ tân',status:'Hoạt động'},{name:'Lê Quốc Huy',role:'Huấn luyện viên',status:'Đã khóa'}];
 const messages={empty:['Không tìm thấy tài khoản','Thử đổi từ khóa hoặc xóa bộ lọc để xem lại danh sách.','Xóa bộ lọc'],error:['Không tải được danh sách','Kết nối bị gián đoạn. Hãy thử tải lại danh sách.','Thử lại'],forbidden:['Bạn không có quyền xem trang này','Tài khoản hiện tại không có quyền quản trị nhân sự.','Về trang chủ'],conflict:['Tài khoản đã được cập nhật','Người quản trị khác vừa thay đổi tài khoản. Tải dữ liệu mới trước khi tiếp tục thao tác.','Tải lại dữ liệu']};
 function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{previewState:state.value},privateContent:{search:search.value,role:role.value,status:status.value}}).catch(()=>{});}
 function render(){
  const filtered=rows.filter(r=>r.name.toLocaleLowerCase('vi').includes(search.value.toLocaleLowerCase('vi'))&&(!role.value||r.role===role.value)&&(!status.value||r.status===status.value));
  let kind=state.value;if(kind==='ready'&&!filtered.length)kind='empty';
  body.setAttribute('aria-busy',String(kind==='loading'));
  if(kind==='ready'||kind==='loading'){
   body.innerHTML='<div class="sh-wrap"><table aria-label="Danh sách tài khoản nhân sự"><thead><tr><th scope="col">Họ tên</th><th scope="col" class="sh-role-col">Vai trò</th><th scope="col">Trạng thái</th><th scope="col">Thao tác</th></tr></thead><tbody>'+(kind==='loading'?rows.map(()=>'<tr><td><div class="sh-skeleton"></div></td><td class="sh-role-col"><div class="sh-skeleton"></div></td><td><div class="sh-skeleton"></div></td><td><div class="sh-skeleton"></div></td></tr>').join(''):filtered.map(r=>'<tr><th scope="row">'+r.name+'</th><td class="sh-role-col">'+r.role+'</td><td><span class="sh-chip '+(r.status==='Đã khóa'?'locked':'')+'">'+r.status+'</span></td><td><button type="button" class="cursor-interaction" data-open="'+r.name+'">Chi tiết</button></td></tr>').join(''))+'</tbody></table></div>'+(kind==='loading'?'<p class="sh-caption">Đang tải danh sách…</p>':'<div class="sh-footer"><span>'+filtered.length+' tài khoản · Trang 1 / 1</span><span>Table + StatusChip</span></div>');
   body.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{body.innerHTML='<div class="sh-state"><h3>'+b.dataset.open+'</h3><p>Vùng chi tiết tài khoản được mở từ hành động cuối dòng.</p><button class="cursor-interaction" type="button" id="sh-back">Quay lại danh sách</button></div>';find('sh-back').onclick=render;});
  }else{
   const m=messages[kind];
   body.innerHTML='<div class="sh-state" '+(kind==='error'||kind==='conflict'?'role="alert"':'')+'><h3>'+m[0]+'</h3><p>'+m[1]+'</p><button class="sh-primary cursor-interaction" type="button" id="sh-action">'+m[2]+'</button></div>';
   find('sh-action').onclick=()=>{search.value='';role.value='';status.value='';state.value='ready';render();save();};
   if(kind==='forbidden')find('sh-action').onclick=()=>{body.innerHTML='<div class="sh-state"><h3>Trang chủ Admin</h3><button type="button" class="cursor-interaction" id="sh-return">Quay lại mẫu danh sách</button></div>';find('sh-return').onclick=()=>{state.value='ready';render();save();};};
  }
 }
 function restore(s){if(!s)return;const k=s.modelContent?.previewState;if(['ready','loading','empty','error','forbidden','conflict'].includes(k))state.value=k;search.value=s.privateContent?.search||'';role.value=s.privateContent?.role||'';status.value=s.privateContent?.status||'';render();}
 [state,role,status].forEach(el=>el.addEventListener('change',()=>{render();save();}));search.addEventListener('input',()=>{render();save();});
 find('sh-reset').onclick=()=>{search.value='';role.value='';status.value='';render();save();};
 render();restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
})();
</script>
