name: CI Develop

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/SportHub.sln

      - name: Build
        run: dotnet build backend/SportHub.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/SportHub.sln --configuration Release --no-build --logger "trx;LogFilePrefix=ci"

      - name: Upload backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/**/TestResults/*.trx
          if-no-files-found: warn

  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Localization guard
        run: npm run check:i18n

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  e2e:
    name: Frontend E2E + API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    env:
      POSTGRES_USER: sporthub
      POSTGRES_PASSWORD: ci-sporthub-password
      POSTGRES_DB: sporthub_e2e
      POSTGRES_PORT: 5435
      JwtOptions__SecretKey: ci-only-sporthub-jwt-secret-key-at-least-32-characters
      Google__ClientId: ""
      VnPay__UseMock: "true"
      Email__DemoLoggingEnabled: "false"
      ASPNETCORE_ENVIRONMENT: Development
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:5000
      P2_LIVE_API: http://127.0.0.1:5000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
      Cors__AllowedOrigins__1: http://127.0.0.1:3100

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start isolated PostgreSQL and API
        run: docker compose up -d --build postgres backend

      - name: Wait for API health
        shell: bash
        run: |
          for i in {1..90}; do
            if curl --fail --silent http://127.0.0.1:5000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend postgres
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend for E2E
        working-directory: frontend
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run acceptance E2E
        working-directory: frontend
        run: >-
          npx playwright test --workers=1
          tests/public-auth.spec.ts
          tests/member.spec.ts
          tests/receptionist.spec.ts
          tests/manager-multisport.spec.ts
          tests/external-coach.spec.ts
          tests/coach-training.spec.ts
          tests/payment-lifecycle.spec.ts
          tests/rbac.spec.ts
          tests/api-coverage.spec.ts
          tests/refactor-live.spec.ts
          tests/refactor-operations-live.spec.ts

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: warn

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color backend postgres

      - name: Stop E2E services
        if: always()
        run: docker compose down -v
