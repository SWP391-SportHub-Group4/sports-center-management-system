services:
  postgres:
    image: postgres:16-alpine
    container_name: sporthub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - sporthub_pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: SportHub.API/Dockerfile
    container_name: sporthub-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      JwtOptions__SecretKey: ${JwtOptions__SecretKey}
      Google__ClientId: ${Google__ClientId}

      VnPay__TmnCode: ${VnPay__TmnCode:-}
      VnPay__HashSecret: ${VnPay__HashSecret:-}
      VnPay__PaymentUrl: ${VnPay__PaymentUrl:-}
      VnPay__QueryUrl: ${VnPay__QueryUrl:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      VnPay__ReturnUrl: ${VnPay__ReturnUrl:-http://localhost:5000/api/payments/vnpay/return}
      VnPay__UseMock: ${VnPay__UseMock:-true}

      Smtp__Host: ${Email__Smtp__Host:-}
      Smtp__Port: ${Email__Smtp__Port:-587}
      Smtp__Username: ${Email__Smtp__Username:-}
      Smtp__Password: ${Email__Smtp__Password:-}
      Smtp__FromAddress: ${Email__Smtp__FromAddress:-}
      Smtp__FromName: ${Email__Smtp__FromName:-SportHub}
      Smtp__UseSsl: ${Email__Smtp__UseSsl:-false}
      Email__DemoLoggingEnabled: ${Email__DemoLoggingEnabled:-true}
      DataProtection__KeysPath: ${DataProtection__KeysPath:-/var/lib/sporthub/dataprotection-keys}


      Gemini__ApiKey: ${Gemini__ApiKey:-}
      Gemini__Model: ${Gemini__Model:-gemini-3.5-flash-lite}
      Gemini__BaseUrl: ${Gemini__BaseUrl:-https://generativelanguage.googleapis.com}
      Gemini__TimeoutSeconds: ${Gemini__TimeoutSeconds:-30}

      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    ports:
      - "5000:8080"
    volumes:
      - sporthub_dataprotection:/var/lib/sporthub/dataprotection-keys

  frontend:
    build:
      context: ./frontend
    container_name: sporthub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "3000:3000"

volumes:
  sporthub_pgdata:
  sporthub_dataprotection:
