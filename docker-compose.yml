services:
  postgres:
    image: postgres:16-alpine
    container_name: sporthub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - sporthub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  ai-service:
    build: ./ai-service
    container_name: sporthub-ai
    restart: unless-stopped
    # Key đọc từ ai-service/.env (gitignored). Khi deploy, tạo file này trên server.
    env_file:
      - path: ./ai-service/.env
        required: false
    environment:
      GEMINI_MODEL: ${Gemini__Model:-gemini-3.5-flash-lite}
    ports:
      - "127.0.0.1:8001:8001"

volumes:
  sporthub_pgdata:
