services:
  postgres:
    image: postgres:16-alpine
    container_name: sporthub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - sporthub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: SportHub.API/Dockerfile
    container_name: sporthub-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      AiService__BaseUrl: http://ai-service:8001
      DataProtection__KeysPath: /var/lib/sporthub/dataprotection-keys
      Reports__StorageRoot: /var/lib/sporthub/reports
      Cors__AllowedOrigins__0: "http://localhost:${FRONTEND_PORT:-3000}"
      Cors__AllowedOrigins__1: "http://127.0.0.1:${FRONTEND_PORT:-3000}"
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    volumes:
      - sporthub_dataprotection:/var/lib/sporthub/dataprotection-keys
      - sporthub_reports:/var/lib/sporthub/reports
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5000}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${Google__ClientId:-}
    container_name: sporthub-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  ai-service:
    build: ./ai-service
    container_name: sporthub-ai
    restart: unless-stopped
    # Key đọc từ ai-service/.env (gitignored). Khi deploy, tạo file này trên server.
    env_file:
      - path: ./ai-service/.env
        required: false
    environment:
      GEMINI_MODEL: ${Gemini__Model:-gemini-3.5-flash-lite}
    ports:
      - "127.0.0.1:8001:8001"

volumes:
  sporthub_pgdata:
  sporthub_dataprotection:
  sporthub_reports:
